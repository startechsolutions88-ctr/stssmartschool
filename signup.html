<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - STS Smart School</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="branding-header">
        <h1>STS Smart School</h1>
        <p class="motto">Global Tech Starts Here</p>
        <p class="company">Star Tech Solutions Limited</p>
      </div>

      <div id="authError" class="hidden" style="color: var(--danger-color); margin-bottom: 15px; font-size: 0.85rem; text-align: center;"></div>
      <div id="authSuccess" class="hidden" style="color: var(--accent-color); margin-bottom: 15px; font-size: 0.85rem; text-align: center;"></div>

      <form id="signupForm">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" class="form-control" required placeholder="e.g. Levison Kamwajo">
        </div>
        <div class="form-group">
          <label for="signupEmail">Account Email</label>
          <input type="email" id="signupEmail" class="form-control" required placeholder="user@school.edu.zm">
        </div>
        <div class="form-group">
          <label for="signupRole">User Role</label>
          <select id="signupRole" class="form-control" required>
            <option value="admin">Administrator</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" class="form-control" required placeholder="Minimum 6 characters" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <div style="margin-top: 20px; text-align: center; font-size: 0.85rem;">
        <p>Already have an account? <a href="login.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold;">Sign In</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
