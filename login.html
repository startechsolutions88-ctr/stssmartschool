<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - STS Smart School</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="branding-header">
        <h1>STS Smart School</h1>
        <p class="motto">Global Tech Starts Here</p>
        <p class="company">Star Tech Solutions Limited</p>
      </div>

      <div id="authError" class="hidden" style="color: var(--danger-color); margin-bottom: 15px; font-size: 0.85rem; text-align: center;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Account Email</label>
          <input type="email" id="email" class="form-control" required placeholder="admin@school.edu.zm">
        </div>
		<div class="form-group">
  <label for="password">Password</label>
  <input type="password" id="password" class="form-control" required placeholder="••••••••">
  <div style="text-align: right; margin-top: 5px;">
    <a href="forgot-password.html" style="font-size: 0.8rem; color: var(--primary-color); text-decoration: none;">Forgot Password?</a>
  </div>
</div>
		
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
	  <!-- Insert just below the </form> tag in login.html -->
<div style="margin-top: 20px; text-align: center; font-size: 0.85rem;">
  <p>Don't have an account? <a href="signup.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold;">Sign Up</a></p>
</div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
