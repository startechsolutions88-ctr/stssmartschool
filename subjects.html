<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Management - STS Smart School</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>STS Smart School</h2>
        <span>Star Tech Solutions</span>
      </div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="students.html">Students</a></li>
        <li><a href="teachers.html">Teachers</a></li>
        <li><a href="classes.html">Classes</a></li>
        <li class="active"><a href="subjects.html">Subjects</a></li>
        <li><a href="results.html">Results Management</a></li>
        <li><a href="reports.html">Report Cards</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <h3>Subject Management</h3>
        <div class="user-profile">
          <span class="user-badge" id="userRoleDisplay">ADMIN</span>
          <span id="userNameDisplay">User</span>
          <a href="#" id="logoutBtn" class="btn btn-sm btn-danger">Logout</a>
        </div>
      </header>

      <section class="content-card">
        <h3>Add Curriculum Subject</h3>
        <form id="subjectForm" style="margin-top: 15px;">
          <div class="form-grid">
            <div class="form-group">
              <label for="subjectCode">Subject Code</label>
              <input type="text" id="subjectCode" class="form-control" placeholder="e.g. MATH101" required>
            </div>
            <div class="form-group">
              <label for="subjectName">Subject Name</label>
              <input type="text" id="subjectName" class="form-control" placeholder="e.g. Mathematics" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Save Subject</button>
        </form>
      </section>

      <section class="content-card">
        <h3>Registered Curriculum Subjects</h3>
        <div class="table-responsive" style="margin-top: 15px;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Subject Code</th>
                <th>Subject Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="subjectTableBody">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
