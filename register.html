<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register School - STS Smart School</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card" style="max-width: 550px;">
      <div class="branding-header">
        <h1>STS Smart School</h1>
        <p class="motto">Global Tech Starts Here</p>
        <p class="company">Star Tech Solutions Limited</p>
        <h3 style="margin-top: 15px; color: var(--primary-color);">Register Your Institution</h3>
      </div>

      <div id="registerError" class="hidden" style="color: var(--danger-color); margin-bottom: 15px; font-size: 0.85rem; text-align: center;"></div>
      <div id="registerSuccess" class="hidden" style="color: var(--accent-color); margin-bottom: 15px; font-size: 0.85rem; text-align: center;"></div>

      <form id="schoolRegisterForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="regSchoolName">School Name</label>
            <input type="text" id="regSchoolName" class="form-control" required placeholder="e.g. Lusaka Academy">
          </div>
          <div class="form-group">
            <label for="regSchoolType">School Type</label>
            <select id="regSchoolType" class="form-control" required>
              <option value="Primary">Primary</option>
              <option value="Secondary">Secondary</option>
              <option value="Combined">Combined (Primary & Secondary)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="regProvince">Province</label>
            <select id="regProvince" class="form-control" required>
              <option value="Central">Central</option>
              <option value="Copperbelt">Copperbelt</option>
              <option value="Eastern">Eastern</option>
              <option value="Luapula">Luapula</option>
              <option value="Lusaka">Lusaka</option>
              <option value="Muchinga">Muchinga</option>
              <option value="Northern">Northern</option>
              <option value="North-Western">North-Western</option>
              <option value="Southern">Southern</option>
              <option value="Western">Western</option>
            </select>
          </div>
          <div class="form-group">
            <label for="regDistrict">District</label>
            <input type="text" id="regDistrict" class="form-control" required placeholder="e.g. Mazabuka">
          </div>
          <div class="form-group">
            <label for="regEmail">Administrative Email</label>
            <input type="email" id="regEmail" class="form-control" required placeholder="admin@school.edu.zm">
          </div>
          <div class="form-group">
            <label for="regPhone">Contact Phone Number</label>
            <input type="tel" id="regPhone" class="form-control" required placeholder="+260...">
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" class="form-control" minlength="6" required placeholder="••••••••">
          </div>
          <div class="form-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <input type="password" id="regConfirmPassword" class="form-control" minlength="6" required placeholder="••••••••">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 15px;">Submit Registration</button>
      </form>
      <div style="text-align: center; margin-top: 15px;">
        <a href="login.html" style="font-size: 0.85rem; color: var(--primary-color);">Already registered? Log in here</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
