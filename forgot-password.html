<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - STS Smart School</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="branding-header">
        <h1>STS Smart School</h1>
        <p class="motto">Global Tech Starts Here</p>
        <p class="company">Star Tech Solutions Limited</p>
      </div>

      <p style="text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">
        Enter your registered account email below. We will send you a secure link to reset your password.
      </p>

      <div id="authError" class="hidden" style="color: var(--danger-color); margin-bottom: 15px; font-size: 0.85rem; text-align: center;"></div>
      <div id="authSuccess" class="hidden" style="color: var(--accent-color); margin-bottom: 15px; font-size: 0.85rem; text-align: center;"></div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="resetEmail">Account Email</label>
          <input type="email" id="resetEmail" class="form-control" required placeholder="user@school.edu.zm">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>

      <div style="margin-top: 20px; text-align: center; font-size: 0.85rem;">
        <p>Remembered your password? <a href="login.html" style="color: var(--primary-color); text-decoration: none; font-weight: bold;">Sign In</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
